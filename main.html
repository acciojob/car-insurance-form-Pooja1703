<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	
    <form method="post">

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Name" required>

        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" required>

        <br><br>

        <label for="gender_m">Male</label>
        <input type="radio" id="gender_m" name="gender" required>

        <label for="gender_f">Female</label>
        <input type="radio" id="gender_f" name="gender">

        <br><br>

        <label for="cars">Car Brands</label>
        <select id="cars" required>
            <option>--Please choose an option--</option>
            <option>BMW</option>
            <option>Audi</option>
            <option>Mercedes</option>
        </select>

        <br><br>

        <label for="carage">Age</label>
	    <input type="number" id="carage" placeholder="Age" required>

       <br><br>

        <label for="dop">DOB</label>
        <input type="date" id="dop" required>
		 
        <br><br>

        <label for="tel">Phone Number</label>
        <input type="tel" id="tel" placeholder="xxx-xxx-xxxx">

        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required>

        <br><br>

        <label for="tos">I agree to the TOS</label>
        <input type="checkbox" id="tos" required>

        <br><br>

        <button type="submit">Submit</button>

    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
